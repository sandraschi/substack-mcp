repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome-check
        name: Biome Webapp Check
        entry: powershell -ExecutionPolicy Bypass -File ./scripts/pre-commit-biome.ps1
        language: system
        files: ^webapp/src/
        pass_filenames: false
