[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substack-mcp"
version = "0.1.0"
description = "FastMCP 3.1+ server and webapp dashboard for Substack feeds, drafting, stats, and community"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "markdown>=3.6",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[project.scripts]
substack-mcp = "substack_mcp.server:main"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
